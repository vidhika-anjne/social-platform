spring.application.name=notification-service
server.port=8085

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Must match auth-service secret)
jwt.secret=your_jwt_secret_here

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.chat-events=chat-events
kafka.topic.user-events=user-events
kafka.topic.team-events=team-events

# Aggregation Window (in minutes)
notification.aggregation.window-minutes=5

# Redis Configuration (Real-time Presence & Throttling)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Novu Configuration
novu.api-key=${NOVU_API_KEY:your_novu_api_key_here}
novu.base-url=${NOVU_BASE_URL:https://api.novu.co/v1}
novu.enabled=${NOVU_ENABLED:false}

